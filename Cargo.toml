[package]
name = "rbgame_native"
version = "0.1.0"
authors = ["Daniel P. Clark <6ftdan@gmail.com>"]
edition = "2021"
rust-version = "1.87"
description = "The native half of the rbgame Ruby gem: SDL (pure Rust) exposed to Ruby through Rutie."
license = "MIT OR Apache-2.0"
repository = "https://github.com/danielpclark/rbgame"
publish = false

[lib]
name = "rbgame_native"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
# Rutie 0.13 is the Ruby 3.2–3.4 line. For Ruby 4.0 use `rutie = "0.14"`
# (see README, "Ruby versions"). `no-link` leaves libruby to the `ruby`
# process that loads the extension, which is the right thing for a cdylib.
rutie = { version = "0.13", features = ["no-link"] }
lazy_static = "1"

# Pure-Rust SDL 3. Pinned to a commit so builds are reproducible; refresh
# with `rake sdl:update` (see docs/UPSTREAM.md) when upstream moves.
sdl3 = { git = "https://github.com/danielpclark/SDL", rev = "dc9c4a48bd93d135de6e16e7c805b329670c1e0d" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
